name: contract gates

on:
  push:
    paths:
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

jobs:
  direct-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the GenLayer test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install "genlayer-test==0.29.2" pytest

      # The direct runner resolves a GenLayer *release tag* for the tarball and
      # then uses the contract's pinned runner hash to choose the runner inside
      # it. Without a cache it asks /releases/latest, which lands on the v0.3.0
      # pre-release tag that publishes no genvm-universal.tar.xz asset, so every
      # test would die on a 404. v0.2.16 does publish the asset and does contain
      # the pinned runner hash, so seeding the cache runs the same runner the
      # contract declares and the one the studionet deployment uses.
      - name: Seed the GenVM runner cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-v0.2.16
          restore-keys: gltest-direct-

      - name: Download the runner tarball if the cache missed
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          TARBALL="$HOME/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz"
          if [ ! -f "$TARBALL" ]; then
            curl -fsSL --retry 3 -o "$TARBALL" \
              https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz
          fi
          ls -lh "$TARBALL"
          python - <<'PY'
          from gltest.direct import sdk_loader
          cached = sdk_loader.list_cached_versions()
          print("cached runner releases:", cached)
          if not cached:
              raise SystemExit("cache seeding failed")
          PY

      - name: Check the pinned runner and the byte budget
        run: |
          python - <<'PY'
          import sys

          PIN = '# { "Depends": "py-genlayer:1jb45aa8ynh2a9c9xn3b7qqh8sm5q93hwfp7jqmwsfhh8jpz09h6" }'
          LIMIT = 37500
          for path in ("contracts/repro_lab.py", "contracts/rlt_token.py"):
              raw = open(path, "rb").read()
              if b"\r\n" in raw:
                  sys.exit(f"{path}: must use LF line endings")
              if len(raw) > LIMIT:
                  sys.exit(f"{path}: {len(raw)} bytes exceeds the {LIMIT} limit")
              text = raw.decode("utf-8")
              first = text.splitlines()[0]
              if first != PIN:
                  sys.exit(f"{path}: line 1 must pin the runner, found {first!r}")
              for alias in ("py-genlayer:test", "py-genlayer:latest"):
                  if alias in text:
                      sys.exit(f"{path}: {alias} is not accepted on any network")
              print(f"{path}: pinned runner, {len(raw)} bytes, LF only")
          PY

      - name: Run the direct mode suite
        run: python -m pytest tests/ -q
